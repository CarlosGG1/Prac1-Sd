name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "WaterManagement/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: wm_central
            file: Dockerfile
          - image: wm_monitor
            file: Dockerfile.monitor
          - image: wm_engine
            file: Dockerfile.engine
          - image: wm_fo
            file: Dockerfile.fo
          - image: wm_panel
            file: Dockerfile.panel
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: ./WaterManagement
          file: ./WaterManagement/${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
