name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "WaterManagement/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: wm_central,         file: common/Dockerfile }
          - { image: wm_monitor,         file: monitor/Dockerfile.monitor }
          - { image: wm_engine,          file: central/Dockerfile.engine }
          - { image: wm_fo,              file: operario/Dockerfile.fo }
          - { image: wm_panel,           file: monitor/Dockerfile.panel }
          - { image: wm_operario_web,    file: operario/Dockerfile.operario }
          - { image: wm_estacion_web,    file: estacion/Dockerfile.estacion }
          - { image: wm_web,             file: web/Dockerfile.web }
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./WaterManagement
          file: ./WaterManagement/${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
